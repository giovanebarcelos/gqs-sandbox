# =============================================================================
# GQS23B - SonarQube Community Build + PostgreSQL
# =============================================================================
# Aula 23B (Garantia da Qualidade de Software) - Etapa 1 do laboratorio.
#
# Para a aula, um unico container basta (banco H2 embutido, dados efemeros):
#   docker run -d --name gqs-sonarqube -p 9000:9000 sonarqube:community
#
# Este compose e a versao "de verdade": SonarQube com PostgreSQL, do jeito
# que uma equipe roda em servidor. Os dados sobrevivem a um `docker compose down`
# porque ficam em volumes nomeados.
#
# USO
#   docker compose -f GQS23B-docker-compose.yml up -d
#   # aguarde ~2 min e acesse http://localhost:9000  (admin / admin)
#   docker compose -f GQS23B-docker-compose.yml logs -f sonarqube
#   docker compose -f GQS23B-docker-compose.yml down          # para
#   docker compose -f GQS23B-docker-compose.yml down -v       # para e APAGA os dados
#
# REQUISITO DE SISTEMA (Linux): o Elasticsearch embutido no SonarQube exige
#   sudo sysctl -w vm.max_map_count=524288
#   sudo sysctl -w fs.file-max=131072
# Sem isso o container sobe e morre com "max virtual memory areas ... too low".
# =============================================================================
services:

  db:
    image: postgres:16-alpine
    container_name: gqs-sonar-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
      POSTGRES_DB: sonarqube
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  sonarqube:
    image: sonarqube:community
    container_name: gqs-sonarqube
    depends_on:
      db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: unless-stopped

volumes:
  sonar_db:
  sonar_data:
  sonar_logs:
  sonar_extensions:
