# =============================================================================
# GQS23B - Laboratorio SonarQube + Biblioteca API + Traefik
# =============================================================================
# Aula 23B (Garantia da Qualidade de Software). Tutorial completo em
# GQS23B-Tutorial-SonarQube-Biblioteca.md (mesma pasta).
#
# Servicos atras do Traefik (proxy reverso), acessados por nome:
#
#   http://sonar.localhost               SonarQube (analise estatica + Quality Gate)
#   http://biblioteca.localhost          Biblioteca API em JAVA (Spring Boot) - principal
#   http://biblioteca-python.localhost   Biblioteca API em PYTHON (Flask) - so' com --profile python
#   http://traefik.localhost             painel do Traefik (rotas ativas)
#
# Nomes *.localhost resolvem para 127.0.0.1 sem editar /etc/hosts no Chrome,
# Edge e Firefox e em Linux com systemd-resolved. Fora disso, veja o tutorial.
#
# USO
#   cp .env.example .env                  # e troque a senha do banco
#   docker compose up -d --build
#   docker compose --profile python up -d --build   # + a versao Python da API
#
#   docker compose up -d --build biblioteca   # rebuild so da API Java (apos a correcao)
#   docker compose down                       # para, mantendo as analises
#   docker compose down -v                    # para e APAGA o banco do SonarQube
#
# CONVIVENCIA COM O LAB DA AULA 24: os dois usam a porta 80. Pare um antes de
# subir o outro, ou troque HTTP_PORT no .env.
# =============================================================================
services:

  traefik:
    container_name: gqs23b_traefik
    # v3.6+ e' obrigatorio no Docker Engine 29+, que deixou de aceitar a
    # versao antiga da API usada pelo Traefik 3.5 e anteriores.
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=gqs23b_rede
      - --entrypoints.web.address=:80
      - --api.dashboard=true
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.painel23b.rule=Host(`traefik.localhost`)
      - traefik.http.routers.painel23b.entrypoints=web
      - traefik.http.routers.painel23b.service=api@internal
    networks:
      - rede
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # SonarQube Community Build + PostgreSQL
  # ---------------------------------------------------------------------------
  sonar_db:
    container_name: gqs23b_sonar_db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: sonarqube
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - rede
    restart: unless-stopped

  sonarqube:
    container_name: gqs23b_sonarqube
    image: sonarqube:community
    depends_on:
      sonar_db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar_db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      # APENAS EM LABORATORIO: dispensa as verificacoes do Elasticsearch
      # embutido (vm.max_map_count >= 524288 etc.), que nem sempre da para
      # ajustar em Docker Desktop. Em servidor de verdade, remova esta linha
      # e ajuste o sysctl do host.
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_extensions:/opt/sonarqube/extensions
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      # "UP" so' aparece quando o servidor terminou de iniciar de verdade
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/api/system/status | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.http.routers.sonar.rule=Host(`sonar.localhost`)
      - traefik.http.routers.sonar.entrypoints=web
      - traefik.http.services.sonar.loadbalancer.server.port=9000
    networks:
      - rede
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Aplicacao analisada - versao JAVA (principal)
  # ---------------------------------------------------------------------------
  biblioteca:
    container_name: gqs23b_biblioteca_java
    build: ./java
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
      # So' a versao CORRIGIDA le o token do ambiente; a 1.0.0 usa a constante fixa
      TOKEN_ADMIN: ${TOKEN_ADMIN:?defina TOKEN_ADMIN no .env}
    labels:
      - traefik.enable=true
      - traefik.http.routers.biblioteca.rule=Host(`biblioteca.localhost`)
      - traefik.http.routers.biblioteca.entrypoints=web
      - traefik.http.services.biblioteca.loadbalancer.server.port=8080
    networks:
      - rede
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Aplicacao analisada - versao PYTHON (secundaria; mesma API, mesmos defeitos)
  # So' sobe com: docker compose --profile python up -d
  # ---------------------------------------------------------------------------
  biblioteca-python:
    container_name: gqs23b_biblioteca_python
    build: ./python
    profiles: ["python"]
    environment:
      APP_VERSION: ${APP_VERSION_PYTHON:-1.0.0}
      TOKEN_ADMIN: ${TOKEN_ADMIN:?defina TOKEN_ADMIN no .env}
    labels:
      - traefik.enable=true
      - traefik.http.routers.biblioteca-python.rule=Host(`biblioteca-python.localhost`)
      - traefik.http.routers.biblioteca-python.entrypoints=web
      - traefik.http.services.biblioteca-python.loadbalancer.server.port=5000
    networks:
      - rede
    restart: unless-stopped

networks:
  rede:
    name: gqs23b_rede

volumes:
  sonar_db:
  sonar_data:
  sonar_logs:
  sonar_extensions:
