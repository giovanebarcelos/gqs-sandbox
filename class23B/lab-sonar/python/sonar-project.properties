# =============================================================================
# GQS23B - Configuracao do SonarScanner para a Biblioteca API em Python
# =============================================================================
# Lido pelo sonar-scanner CLI. O equivalente em Java fica nas <properties> do
# pom.xml - la o scanner e' um plugin Maven, aqui e' um programa separado.
#
# Uso (a partir desta pasta, com o ambiente do lab no ar):
#   pytest --cov --cov-report=xml       (o .coveragerc diz o que medir)
#   docker run --rm --network gqs23b_rede -e SONAR_TOKEN=$SONAR_TOKEN \
#     -v "$PWD:/usr/src" sonarsource/sonar-scanner-cli
#
# O scanner roda num container NA MESMA REDE do SonarQube, por isso o host e'
# http://sonarqube:9000 (nome do servico no compose), e nao sonar.localhost.
# O token NUNCA entra neste arquivo: vem da variavel de ambiente SONAR_TOKEN.
# =============================================================================

sonar.projectKey=gqs23b-biblioteca-python
sonar.projectName=GQS23B - Biblioteca API (Python)
sonar.projectVersion=1.0.0

sonar.host.url=http://sonarqube:9000
sonar.sources=biblioteca
sonar.tests=tests

sonar.sourceEncoding=UTF-8
sonar.python.version=3.10, 3.11, 3.12, 3.13

# Cobertura: e' este arquivo que faz o numero do pytest chegar ao dashboard
sonar.python.coverage.reportPaths=coverage.xml

# O scanner roda num container so com esta pasta montada, sem o .git do
# repositorio: desliga a leitura do historico (evita o aviso "SCM provider
# autodetection failed"). No CI, com o checkout completo, pode remover.
sonar.scm.disabled=true
