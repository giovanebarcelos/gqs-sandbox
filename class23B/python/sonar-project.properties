# =============================================================================
# GQS23B - Configuracao do SonarScanner para o projeto Python da Aula 23B
# =============================================================================
# Este arquivo e lido pelo sonar-scanner CLI. O equivalente em Java fica nas
# <properties> do pom.xml - la o scanner e um plugin Maven, aqui e um binario
# separado.
#
# Uso (a partir desta pasta):
#   pytest --cov=. --cov-report=xml
#   docker run --rm --network=host -e SONAR_TOKEN=$SONAR_TOKEN \
#     -v "$PWD:/usr/src" sonarsource/sonar-scanner-cli
#
# O token NUNCA entra neste arquivo: ele vem da variavel de ambiente
# SONAR_TOKEN (o defeito S6437 plantado no codigo existe justamente para
# ensinar isso).
# =============================================================================

sonar.projectKey=gqs-biblioteca-python
sonar.projectName=GQS23B - Biblioteca (Python)
sonar.projectVersion=1.0

sonar.host.url=http://localhost:9000
sonar.sources=GQS23B01-Biblioteca.py
sonar.tests=test_GQS23B01-Biblioteca.py

sonar.sourceEncoding=UTF-8
sonar.python.version=3.10, 3.11, 3.12, 3.13

# Cobertura: e este arquivo que faz o numero do pytest chegar ao dashboard
sonar.python.coverage.reportPaths=coverage.xml
