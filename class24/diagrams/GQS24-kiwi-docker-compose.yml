# =============================================================================
# GQS24 - Kiwi TCMS (Community Edition) + MariaDB
# =============================================================================
# Aula 24 (Garantia da Qualidade de Software) - Etapa 1 do laboratorio.
#
# Adaptado do compose oficial do projeto, com duas mudancas para a sala de aula:
#   1. Portas 8080/8443 no lugar de 80/443 - portas abaixo de 1024 exigem
#      privilegio de root no Linux e conflitam com servidores ja instalados.
#   2. Senhas via .env, em vez de fixas no arquivo (compare com o defeito
#      S6437 discutido na Aula 23B).
#
# USO
#   cp GQS24-kiwi-.env.example .env      # e troque as senhas dentro do .env
#   docker compose -f GQS24-kiwi-docker-compose.yml up -d
#
#   # aguarde ~40s e rode o setup inicial (cria as tabelas e o superusuario):
#   docker exec -it kiwi_web /Kiwi/manage.py initial_setup
#
#   # acesse:  https://localhost:8443     (certificado autoassinado - aceite o aviso)
#   # ou:      http://localhost:8080      (redireciona para HTTPS)
#
#   # Se a porta 8080 ja estiver ocupada na sua maquina, defina no .env:
#   #   KIWI_HTTP_PORT=8090
#   #   KIWI_HTTPS_PORT=8453
#
#   docker compose -f GQS24-kiwi-docker-compose.yml down       # para
#   docker compose -f GQS24-kiwi-docker-compose.yml down -v    # para e APAGA os dados
#
# NOTA SOBRE A EDICAO COMMUNITY
#   - E gratuita e completa em funcionalidade (GPL-2.0), mas:
#   - exibe anuncios (EthicalAds), cuja receita vai para o open collective do projeto;
#   - e rolling release: a tag `latest` e a unica publicada, sem versoes fixas;
#   - a imagem publica e apenas x86_64 - em Mac com Apple Silicon e preciso rodar
#     sob emulacao (`platform: linux/amd64`), o que fica lento.
# =============================================================================
services:

  db:
    container_name: kiwi_db
    image: mariadb:11
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - kiwi_db_data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${KIWI_DB_ROOT_PASSWORD:?defina KIWI_DB_ROOT_PASSWORD no .env}
      MARIADB_DATABASE: kiwi
      MARIADB_USER: kiwi
      MARIADB_PASSWORD: ${KIWI_DB_PASSWORD:?defina KIWI_DB_PASSWORD no .env}
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || mariadb-admin ping -h 127.0.0.1 -u kiwi -p$$MARIADB_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  web:
    container_name: kiwi_web
    image: kiwitcms/kiwi:latest
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Portas configuraveis pelo .env: a 8080 costuma ja estar ocupada por
      # outro servico. Se `docker compose up` falhar com "port is already
      # allocated", troque os valores no .env - nao no compose.
      - "${KIWI_HTTP_PORT:-8080}:8080"
      - "${KIWI_HTTPS_PORT:-8443}:8443"
    volumes:
      - kiwi_uploads:/Kiwi/uploads
    environment:
      KIWI_DB_HOST: db
      KIWI_DB_PORT: 3306
      KIWI_DB_NAME: kiwi
      KIWI_DB_USER: kiwi
      KIWI_DB_PASSWORD: ${KIWI_DB_PASSWORD:?defina KIWI_DB_PASSWORD no .env}
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  kiwi_db_data:
  kiwi_uploads:
