# =============================================================================
# GQS24 - Laboratorio Kiwi TCMS + TechStore API + Traefik
# =============================================================================
# Aula 24 (Garantia da Qualidade de Software). Tutorial completo em
# GQS24-Tutorial-KiwiTCMS-TechStore.md (mesma pasta).
#
# Servicos atras do Traefik (proxy reverso), acessados por nome:
#
#   https://kiwi.localhost        Kiwi TCMS (gestao de testes + bug tracker)
#   http://app.localhost          TechStore API em JAVA (Spring Boot) - principal
#   http://app-python.localhost   TechStore API em PYTHON (Flask) - so' com --profile python
#   http://traefik.localhost      painel do Traefik (rotas ativas)
#
# Nomes *.localhost resolvem para 127.0.0.1 sem editar /etc/hosts no Chrome,
# Edge e Firefox e em Linux com systemd-resolved. Fora disso, veja o tutorial.
#
# USO
#   cp .env.example .env                  # e troque as senhas
#   docker compose up -d --build
#   docker exec -it gqs24_kiwi_web /Kiwi/manage.py initial_setup   # so na 1a vez
#
#   docker compose --profile python up -d --build   # + a versao Python da API
#
#   docker compose up -d --build app      # rebuild so da API Java (apos a correcao)
#   docker compose down                   # para, mantendo os dados
#   docker compose down -v                # para e APAGA o banco do Kiwi
# =============================================================================
services:

  traefik:
    container_name: gqs24_traefik
    # v3.6+ e' obrigatorio no Docker Engine 29+, que deixou de aceitar a
    # versao antiga da API usada pelo Traefik 3.5 e anteriores.
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=gqs24_rede
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true
      # O Kiwi so' fala HTTPS e usa certificado autoassinado dentro do
      # container; o Traefik precisa aceitar esse certificado no backend.
      - --serverstransport.insecureskipverify=true
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.painel.rule=Host(`traefik.localhost`)
      - traefik.http.routers.painel.entrypoints=web
      - traefik.http.routers.painel.service=api@internal
    networks:
      - rede
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Aplicacao sob teste - versao JAVA (principal)
  # ---------------------------------------------------------------------------
  app:
    container_name: gqs24_techstore_java
    build: ./java/app
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`app.localhost`)
      - traefik.http.routers.app.entrypoints=web,websecure
      - traefik.http.services.app.loadbalancer.server.port=8080
    networks:
      - rede
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Aplicacao sob teste - versao PYTHON (secundaria; mesma API, mesmos defeitos)
  # So' sobe com: docker compose --profile python up -d
  # ---------------------------------------------------------------------------
  app-python:
    container_name: gqs24_techstore_python
    build: ./python/app
    profiles: ["python"]
    environment:
      APP_VERSION: ${APP_VERSION_PYTHON:-1.0.0}
    labels:
      - traefik.enable=true
      - traefik.http.routers.app-python.rule=Host(`app-python.localhost`)
      - traefik.http.routers.app-python.entrypoints=web,websecure
      - traefik.http.services.app-python.loadbalancer.server.port=5000
    networks:
      - rede
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Kiwi TCMS (banco + aplicacao)
  # ---------------------------------------------------------------------------
  kiwi_db:
    container_name: gqs24_kiwi_db
    image: mariadb:11
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - kiwi_db_data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${KIWI_DB_ROOT_PASSWORD:?defina KIWI_DB_ROOT_PASSWORD no .env}
      MARIADB_DATABASE: kiwi
      MARIADB_USER: kiwi
      MARIADB_PASSWORD: ${KIWI_DB_PASSWORD:?defina KIWI_DB_PASSWORD no .env}
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - rede
    restart: unless-stopped

  kiwi_web:
    container_name: gqs24_kiwi_web
    image: kiwitcms/kiwi:latest
    depends_on:
      kiwi_db:
        condition: service_healthy
    volumes:
      - kiwi_uploads:/Kiwi/uploads
    environment:
      KIWI_DB_HOST: kiwi_db
      KIWI_DB_PORT: 3306
      KIWI_DB_NAME: kiwi
      KIWI_DB_USER: kiwi
      KIWI_DB_PASSWORD: ${KIWI_DB_PASSWORD:?defina KIWI_DB_PASSWORD no .env}
    labels:
      - traefik.enable=true
      # HTTP -> HTTPS: o Kiwi marca os cookies de sessao como "Secure".
      - traefik.http.routers.kiwi-http.rule=Host(`kiwi.localhost`)
      - traefik.http.routers.kiwi-http.entrypoints=web
      - traefik.http.routers.kiwi-http.middlewares=kiwi-https
      - traefik.http.middlewares.kiwi-https.redirectscheme.scheme=https
      - traefik.http.middlewares.kiwi-https.redirectscheme.port=${HTTPS_PORT:-443}
      - traefik.http.routers.kiwi.rule=Host(`kiwi.localhost`)
      - traefik.http.routers.kiwi.entrypoints=websecure
      - traefik.http.routers.kiwi.tls=true
      - traefik.http.services.kiwi.loadbalancer.server.port=8443
      - traefik.http.services.kiwi.loadbalancer.server.scheme=https
    cap_drop:
      - ALL
    networks:
      - rede
    restart: unless-stopped

networks:
  rede:
    name: gqs24_rede

volumes:
  kiwi_db_data:
  kiwi_uploads:
