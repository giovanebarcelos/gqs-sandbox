# =============================================================================
# CI da Boletim API em Python - Aula 26
#
#   testes      matriz Python 3.11, 3.12 e 3.13: pytest + cobertura >= 80%
#   testes-api  workflow reutilizavel testes-api.yml: imagem + Bruno
# =============================================================================
name: CI Python

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "bruno/**"
      - ".github/workflows/ci-python.yml"
      - ".github/workflows/testes-api.yml"
      - ".github/actions/**"
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - "bruno/**"
      - ".github/workflows/ci-python.yml"
      - ".github/workflows/testes-api.yml"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Testes (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7

      - name: Instalar o Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: pytest + cobertura (falha abaixo de 80%)
        run: >
          pytest -v --cov --cov-report=term-missing
          --cov-report=html:relatorio-cobertura --cov-fail-under=80
          --junitxml=resultados-unitarios.xml

      - name: Resumo da cobertura
        if: success()
        run: |
          echo "### Python ${{ matrix.python }}: cobertura de linhas $(coverage report --format=total)%" \
              >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar relatorios de teste e cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: relatorios-python-${{ matrix.python }}
          path: |
            python/resultados-unitarios.xml
            python/relatorio-cobertura/
          if-no-files-found: ignore

  testes-api:
    name: Testes de API
    needs: testes
    uses: ./.github/workflows/testes-api.yml
    with:
      projeto: python
      porta: 5000
      ambiente-bruno: Python
